<!DOCTYPE html>
<html lang="it">
<head>
  <meta charset="UTF-8" />
  <style>
    body { font-family: sans-serif; font-size: 14px; color: #333; }
    h2   { margin-bottom: 8px; }
    table { border-collapse: collapse; margin-bottom: 16px; }
    td   { padding: 6px 12px; border-bottom: 1px solid #eee; }
    td:first-child { font-weight: bold; white-space: nowrap; color: #555; }
    .passed  { color: #2e7d32; font-weight: bold; }
    .failed  { color: #c62828; font-weight: bold; }
    .skipped { color: #888; }
    .dashboard a { color: #1565c0; }
  </style>
</head>
<body>

  <h2>{{ icon }} Run completata — {{ site }}</h2>

  <table>
    <tr><td>Site</td>          <td>{{ site }}</td></tr>
    <tr><td>Data</td>          <td>{{ dateStr }}</td></tr>
    <tr><td>Run</td>           <td><code>{{ runId }}</code></td></tr>
    <tr><td>Durata totale</td> <td>{{ duration }}</td></tr>
    <tr><td>✅ Passati</td>    <td><span class="passed">{{ stats.passed }}</span></td></tr>
    <tr><td>❌ Falliti</td>    <td>
      <span class="{{ 'failed' if stats.failed > 0 else 'passed' }}">{{ stats.failed }}</span>
    </td></tr>
    <tr><td>⏭ Skippati</td>   <td><span class="skipped">{{ stats.skipped }}</span></td></tr>
  </table>

  <div class="dashboard">
    <a href="{{ dashboardUrl }}">🔗 Apri Dashboard</a>
  </div>

</body>
</html>
