<!DOCTYPE html>
<html lang="it">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1.0">
<title>Test Report Dashboard</title>
<script src="https://cdn.jsdelivr.net/npm/vue@3/dist/vue.global.prod.js"></script>
<style>
*{box-sizing:border-box;margin:0;padding:0}
body{font-family:-apple-system,BlinkMacSystemFont,'Segoe UI',Roboto,sans-serif;background:#f0f2f5;color:#1f2937}
header{background:#1a1a2e;color:#fff;padding:14px 24px;display:flex;align-items:center;gap:12px}
header h1{font-size:21px;font-weight:700}
.subtitle{font-size:12px;color:#94a3b8;margin-left:auto}
.refresh-btn{margin-left:12px;background:#334155;border:none;color:#cbd5e1;font-size:12px;padding:4px 10px;border-radius:6px;cursor:pointer}
.refresh-btn:hover{background:#475569}
.container{max-width:1200px;margin:0 auto;padding:24px}
.site-card{background:#fff;border-radius:10px;margin-bottom:20px;box-shadow:0 1px 4px rgba(0,0,0,.08);overflow:hidden}
.site-header{padding:13px 18px;cursor:pointer;display:flex;align-items:center;gap:10px;background:#1a1a2e;color:#fff;user-select:none}
.site-header:hover{background:#16213e}
.site-title{font-size:17px;font-weight:700;flex:1}
.site-meta{font-size:12px;color:#94a3b8;display:flex;align-items:center;gap:4px}
.run-item{border-top:1px solid #e5e7eb}
.run-header{padding:10px 18px;cursor:pointer;display:flex;align-items:center;gap:10px;background:#f8f9fb;user-select:none;transition:background .15s}
.run-header:hover{background:#eef0f4}
.run-id{font-size:13px;font-weight:600;color:#374151;flex:none;white-space:nowrap}
.run-date{font-size:12px;color:#6b7280;flex:1;padding:0 8px}
.run-stats{display:flex;gap:6px;align-items:center;flex-wrap:wrap}
.run-body{padding-left:24px}
.test-item{border-top:1px solid #f0f2f5}
.test-header{padding:9px 18px;cursor:pointer;display:flex;align-items:center;gap:8px;user-select:none;transition:background .15s}
.test-header:hover{background:#f0f2f5}
.test-title{font-size:14px;flex:1}
.test-dur{font-size:11px;color:#9ca3af;white-space:nowrap}
.test-body{padding:12px 18px 18px 48px;background:#fafbfc;border-top:1px solid #f0f2f5}
.suite-name{font-size:11px;color:#9ca3af;margin-bottom:10px}
.section-title{font-size:11px;font-weight:700;color:#374151;margin-bottom:6px;text-transform:uppercase;letter-spacing:.5px}
.steps-list{list-style:none;margin-bottom:16px}
.step-row{display:flex;align-items:baseline;gap:6px;padding:3px 0;border-bottom:1px dashed #f0f2f5}
.step-row:last-child{border-bottom:none}
.step-txt{font-size:12px;font-family:'SFMono-Regular',Consolas,monospace;flex:1;word-break:break-all}
.step-dur{font-size:11px;color:#9ca3af;white-space:nowrap}
.step-err{font-size:11px;color:#b91c1c;margin-left:18px;margin-top:2px}
.no-steps{font-size:12px;color:#9ca3af;font-style:italic;margin-bottom:12px}
.ss-img{max-width:100%;max-height:600px;object-fit:contain;border:1px solid #e5e7eb;border-radius:6px;cursor:zoom-in;display:block;margin-top:6px}
.no-ss{font-size:12px;color:#9ca3af;font-style:italic}
.error-box{background:#fef2f2;color:#991b1b;border:1px solid #fecaca;border-radius:6px;padding:8px 12px;font-size:12px;margin-bottom:12px;white-space:pre-wrap;word-break:break-word}
.badge{display:inline-flex;align-items:center;gap:3px;padding:2px 8px;border-radius:10px;font-size:11px;font-weight:700;white-space:nowrap}
.bp{background:#d1fae5;color:#065f46}
.bf{background:#fee2e2;color:#991b1b}
.bs{background:#fef3c7;color:#92400e}
.bw{background:#fff7ed;color:#92400e}
.arr{display:inline-block;font-size:10px;color:#9ca3af;transition:transform .2s;flex:none}
.arr.open{transform:rotate(90deg)}
.loading{text-align:center;padding:60px;font-size:17px;color:#6b7280}
.empty{text-align:center;padding:40px;font-size:14px;color:#9ca3af;font-style:italic}
.lightbox{display:none;position:fixed;inset:0;background:rgba(0,0,0,.87);z-index:9999;align-items:center;justify-content:center;cursor:zoom-out}
.lightbox.on{display:flex}
.lightbox img{max-width:96vw;max-height:96vh;object-fit:contain;border-radius:4px}
</style>
</head>
<body>

<div id="app">

  <header>
    <span style="font-size:22px">📊</span>
    <h1>Test Report Dashboard</h1>
    <span class="subtitle">{{ updatedAt ? 'Aggiornato: ' + updatedAt : '' }}</span>
    <button class="refresh-btn" @click="loadData">&#x21BB; Aggiorna</button>
  </header>

  <div class="container">

    <div v-if="loading" class="loading">⏳ Caricamento…</div>

    <div v-else-if="errorMsg" class="empty">Errore caricamento: {{ errorMsg }}</div>

    <div v-else-if="!hasSites" class="empty">
      Nessun risultato trovato. Esegui prima: <code>npm run run</code>
    </div>

    <template v-else>

      <div v-for="(runs, siteName) in sites" :key="siteName" class="site-card">

        <!-- Site header -->
        <div class="site-header" @click="toggle('site', siteName)">
          <span style="font-size:18px">🌐</span>
          <span class="site-title">{{ siteName }}</span>
          <span class="site-meta">
            {{ runs.length }} run &nbsp;
            <span v-if="siteHasFail(runs)">❌</span>
            <span v-else>✅</span>
          </span>
          <span class="arr" :class="{ open: isOpen('site', siteName) }">&#x25B6;</span>
        </div>

        <!-- Runs list -->
        <div v-show="isOpen('site', siteName)">
          <div v-for="run in runs" :key="run.runId" class="run-item">

            <!-- Run header -->
            <div class="run-header" @click="toggle('run', run.runId)">
              <span class="arr" :class="{ open: isOpen('run', run.runId) }">&#x25B6;</span>
              <span class="run-id">{{ run.runId }}</span>
              <span class="run-date">{{ fmtDate(run.startTime) }}</span>
              <div class="run-stats">
                <span class="badge" :class="runBadgeClass(run)">
                  <span v-if="run.stats && run.stats.failed > 0">❌</span>
                  <span v-else>✅</span>
                  {{ (run.stats && run.stats.passed) || 0 }}P /
                  {{ (run.stats && run.stats.failed) || 0 }}F /
                  {{ (run.stats && run.stats.skipped) || 0 }}S
                </span>
                <span v-if="run.duration" style="font-size:11px;color:#9ca3af">{{ fmtDur(run.duration) }}</span>
                <span v-if="run.legacy" class="badge bw">report precedente</span>
              </div>
            </div>

            <!-- Run body -->
            <div v-show="isOpen('run', run.runId)" class="run-body">
              <template v-if="run.tests && run.tests.length">
                <div v-for="(test, ti) in run.tests" :key="ti" class="test-item">

                  <!-- Test header -->
                  <div class="test-header" @click="toggle('test', run.runId + '_' + ti)">
                    <span class="arr" :class="{ open: isOpen('test', run.runId + '_' + ti) }">&#x25B6;</span>
                    <span class="badge" :class="statusBadge(test.status)">{{ test.status }}</span>
                    <span class="test-title">{{ test.title }}</span>
                    <span class="test-dur">{{ fmtDur(test.duration) }}</span>
                  </div>

                  <!-- Test body -->
                  <div v-show="isOpen('test', run.runId + '_' + ti)" class="test-body">
                    <div v-if="test.suiteName" class="suite-name">{{ test.suiteName }}</div>
                    <div v-if="test.error" class="error-box">{{ test.error.slice(0, 500) }}</div>

                    <div class="section-title">Steps</div>
                    <p v-if="!test.steps || !test.steps.length" class="no-steps">
                      Nessuno step registrato — gli step saranno visibili dalla prossima esecuzione.
                    </p>
                    <ul v-else class="steps-list">
                      <li v-for="(step, si) in test.steps" :key="si">
                        <div class="step-row">
                          <span style="font-size:12px;flex:none">
                            <span v-if="step.error">❌</span>
                            <span v-else>✅</span>
                          </span>
                          <span class="step-txt" :style="{ color: stepColor(step.category) }">{{ step.title }}</span>
                          <span class="step-dur">{{ fmtDur(step.duration) }}</span>
                        </div>
                        <div v-if="step.error" class="step-err">{{ step.error.slice(0, 300) }}</div>
                      </li>
                    </ul>

                    <div class="section-title" style="margin-top:12px">Screenshot finale</div>
                    <img v-if="test.screenshot"
                      class="ss-img"
                      :src="ssrc(test.screenshot)"
                      alt="screenshot"
                      loading="lazy"
                      @click="openLightbox(ssrc(test.screenshot))">
                    <p v-else class="no-ss">Nessuno screenshot disponibile</p>
                  </div>

                </div>
              </template>
              <div v-else class="empty">
                <template v-if="run.legacy">
                  Run eseguita prima del reporter personalizzato — riesegui i test per vedere gli step.
                </template>
                <template v-else>Nessun test trovato in questo run.</template>
              </div>
            </div>

          </div>
        </div>

      </div>

    </template>
  </div>

  <!-- Lightbox -->
  <div class="lightbox" :class="{ on: lightboxSrc }" @click="closeLightbox">
    <img :src="lightboxSrc" alt="screenshot" @click.stop>
  </div>

</div>

<script>
const { createApp, ref, reactive, computed } = Vue;

createApp({
  setup() {
    const sites      = ref({});
    const loading    = ref(true);
    const errorMsg   = ref('');
    const updatedAt  = ref('');
    const lightboxSrc = ref('');
    const openItems  = reactive({});

    const hasSites = computed(() => Object.keys(sites.value).length > 0);

    const fmtDate = (iso) => {
      if (!iso) return '';
      try {
        return new Date(iso).toLocaleString('it-IT', {
          day: '2-digit', month: '2-digit', year: 'numeric',
          hour: '2-digit', minute: '2-digit', second: '2-digit'
        });
      } catch (e) { return iso; }
    };

    const fmtDur = (ms) => {
      if (ms == null) return '';
      return ms < 1000 ? `${ms}ms` : `${(ms / 1000).toFixed(1)}s`;
    };

    const toggle = (type, id) => {
      const key = `${type}:${id}`;
      openItems[key] = !openItems[key];
    };

    const isOpen = (type, id) => !!openItems[`${type}:${id}`];

    const siteHasFail   = (runs) => runs.some(r => r.stats && r.stats.failed > 0);
    const runBadgeClass = (run)  => (run.stats && run.stats.failed > 0) ? 'bf' : 'bp';

    const statusBadge = (status) => {
      if (status === 'passed') return 'bp';
      if (status === 'failed' || status === 'timedOut') return 'bf';
      return 'bs';
    };

    const stepColor = (category) => {
      if (category === 'expect')    return '#7c3aed';
      if (category === 'test.step') return '#0369a1';
      return '#1f2937';
    };

    const ssrc = (screenshot) => `/img?path=${encodeURIComponent(screenshot)}`;

    const openLightbox  = (src) => { lightboxSrc.value = src; };
    const closeLightbox = ()    => { lightboxSrc.value = ''; };

    const loadData = async () => {
      loading.value  = true;
      errorMsg.value = '';
      try {
        const res = await fetch('/api/data');
        if (!res.ok) throw new Error(`HTTP ${res.status}`);
        const data = await res.json();
        sites.value = data;
        updatedAt.value = new Date().toLocaleTimeString('it-IT');
        // Open all sites by default
        Object.keys(data).forEach(name => { openItems[`site:${name}`] = true; });
      } catch (e) {
        errorMsg.value = e.message;
      } finally {
        loading.value = false;
      }
    };

    document.addEventListener('keydown', (e) => {
      if (e.key === 'Escape') closeLightbox();
    });

    loadData();

    return {
      sites, loading, errorMsg, updatedAt, lightboxSrc,
      hasSites, fmtDate, fmtDur, toggle, isOpen,
      siteHasFail, runBadgeClass, statusBadge, stepColor,
      ssrc, openLightbox, closeLightbox, loadData
    };
  }
}).mount('#app');
</script>
</body>
</html>
